name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The published site is the standalone static build (index.html + photo.jpg).
      # It needs no bundler, so no `npm ci` / `npm run build` is performed.
      # Note: the Next.js rewrite under app/ is intentionally NOT deployed.
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp photo.jpg _site/photo.jpg
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
